# ==============================================================================
# Deploy access vending  (TEMPLATE FOR CONSUMERS)
#
# Copy this file to .github/workflows/ in your own repo, together with main.tf,
# variables.tf, versions.tf and your terraform.tfvars.
#
# Manual dispatch only. This repo decides who can become Groups Administrator in
# your tenant; an accidental push to main should not change that. Pick the action.
#
# On first run the workflow provisions its own state storage — resource group,
# storage account, blob container, and the RBAC the CI identity needs. No manual
# prerequisites beyond the identity itself.
#
# ------------------------------------------------------------------------------
# REQUIRED GITHUB CONFIGURATION  (Settings → Secrets and variables → Actions)
#
#   Secrets:
#     AZURE_CLIENT_ID         Client ID of the CI service principal (OIDC)
#     AZURE_TENANT_ID         Entra tenant ID
#     AZURE_SUBSCRIPTION_ID   Subscription the azurerm provider authenticates to
#
#   Variables:
#     AZURE_LOCATION          e.g. norwayeast   (used when creating state storage)
#     STATE_RESOURCE_GROUP    e.g. rg-tfstate           created if missing
#     STATE_STORAGE_ACCOUNT   e.g. sttfstate1a2b        created if missing
#     STATE_CONTAINER         optional, default: tfstate
#     VENDING_STATE_KEY       optional, default: access-vending.tfstate
#
# ------------------------------------------------------------------------------
# WHY terraform.tfvars IS COMMITTED, NOT GENERATED
#
# Other module templates generate terraform.tfvars from flat GitHub variables.
# That does not work here: access_scopes is a deeply nested map of objects
# describing arbitrary scopes and roles, and serialising it from flat repo
# variables would be more fragile than the problem it solves.
#
# Committing it is also better on its own merits. For an access-vending system the
# configuration IS the governance record — "who is systemeier for prod" and "which
# roles require dual approval" are exactly the changes that belong in a reviewed
# PR with history. Storing it as a secret would remove that review entirely.
#
# Your repo therefore needs terraform.tfvars tracked in git. Add an exception if
# your .gitignore excludes *.tfvars:
#
#     !terraform.tfvars
#
# Keep genuine credentials out of it — tenant_id and provider_subscription_id come
# from secrets via TF_VAR_ below.
#
# ------------------------------------------------------------------------------
# CI IDENTITY PERMISSIONS
#
# Graph (application permissions, admin consent required) — the module's
# bootstrap/grant-graph-permissions.sh grants exactly this set:
#     Group.ReadWrite.All
#     User.Read.All
#     RoleManagementPolicy.ReadWrite.AzureADGroup
#     PrivilegedEligibilitySchedule.ReadWrite.AzureADGroup
#     RoleManagement.ReadWrite.Directory              (only if you use entra_role)
#     RoleEligibilitySchedule.ReadWrite.Directory     (only if you use entra_role)
#
# Azure RBAC, per vended subscription — only if you use azure_pim:
#     User Access Administrator    (role bindings AND PIM policies; the tighter
#                                   "Role Based Access Control Administrator" is
#                                   NOT enough for the policies)
#
# RoleManagement.ReadWrite.Directory lets the identity assign directory roles
# anywhere in the tenant, including to itself. Use a dedicated service principal
# for this repo rather than a shared one.
#
# ------------------------------------------------------------------------------
# ORDER OF OPERATIONS
#
# This must apply BEFORE the access-package repo. Not only because the groups must
# exist: for pim_for_groups the PIM policy must be written first, or the access
# package resource-role picker offers only "Member" and not "Eligible Member" —
# giving active membership instead of JIT, with nothing failing.
# ==============================================================================

name: Deploy access vending

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

concurrency:
  # State is a single file. Two concurrent runs give a lock conflict at best.
  group: access-vending-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    # ubuntu-latest keeps this portable. Self-hosted runners work too — OIDC
    # (id-token: write) is available on them as well:
    #   runs-on: [self-hosted, azure, container-instance]
    runs-on: ubuntu-latest

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Provider config comes from secrets, not from the committed tfvars.
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_provider_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Azure login (OIDC)
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          # Pinned exactly, and bumped deliberately.
          #
          # 1.9 is the module's hard floor — its validations use cross-variable
          # references, which do not exist before that. But do not write
          # "~> 1.9" here: with two components that means ">= 1.9, < 2.0", so it
          # silently follows every new 1.x release rather than staying on 1.9.
          #
          # Pinning matters more than usual for this module. A null-guard bug in
          # v0.1.0 could not be reproduced on 1.14.5 or 1.16.1 locally yet failed
          # in CI, so evaluation behaviour varies by version or context. A
          # floating version means an unchanged commit can start failing.
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Check terraform.tfvars is present
        run: |
          if [ ! -f terraform.tfvars ]; then
            echo "::error::terraform.tfvars not found. It must be COMMITTED in this repo — see the header of this workflow. If your .gitignore excludes *.tfvars, add an exception: !terraform.tfvars"
            exit 1
          fi
          echo "Found terraform.tfvars ($(wc -l < terraform.tfvars) lines)"

      - name: Ensure state storage exists
        env:
          STATE_RG: ${{ vars.STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.STATE_CONTAINER || 'tfstate' }}
          LOCATION: ${{ vars.AZURE_LOCATION }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -z "$STATE_RG" ] || [ -z "$STATE_SA" ]; then
            echo "::error::STATE_RESOURCE_GROUP and STATE_STORAGE_ACCOUNT variables must be set."
            exit 1
          fi
          if [ -z "$LOCATION" ]; then
            echo "::error::AZURE_LOCATION variable must be set (needed to create state storage)."
            exit 1
          fi

          az group create --name "$STATE_RG" --location "$LOCATION" -o none 2>/dev/null || true

          if ! az storage account show --name "$STATE_SA" --resource-group "$STATE_RG" -o none 2>/dev/null; then
            echo "Creating state storage account $STATE_SA..."
            az storage account create \
              --name "$STATE_SA" --resource-group "$STATE_RG" --location "$LOCATION" \
              --sku Standard_LRS --allow-blob-public-access false \
              --min-tls-version TLS1_2 -o none

            # The CI identity needs data-plane access; use_azuread_auth means RBAC,
            # not access keys.
            PRINCIPAL_ID=$(az ad sp show --id "$CLIENT_ID" --query id -o tsv)
            STORAGE_ID=$(az storage account show --name "$STATE_SA" --resource-group "$STATE_RG" --query id -o tsv)
            az role assignment create \
              --assignee-object-id "$PRINCIPAL_ID" --assignee-principal-type ServicePrincipal \
              --role "Storage Blob Data Contributor" --scope "$STORAGE_ID" -o none
            echo "Waiting 30s for the role assignment to propagate..."
            sleep 30
          fi

          az storage container create \
            --name "$STATE_CONTAINER" --account-name "$STATE_SA" \
            --auth-mode login -o none 2>/dev/null || true

      - name: Generate backend.hcl
        env:
          STATE_RG: ${{ vars.STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.STATE_CONTAINER || 'tfstate' }}
          STATE_KEY: ${{ vars.VENDING_STATE_KEY || 'access-vending.tfstate' }}
        run: |
          cat > backend.hcl <<EOF
          resource_group_name  = "$STATE_RG"
          storage_account_name = "$STATE_SA"
          container_name       = "$STATE_CONTAINER"
          key                  = "$STATE_KEY"
          use_azuread_auth     = true
          use_oidc             = true
          EOF

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: inputs.action != 'destroy'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform plan (destroy)
        if: inputs.action == 'destroy'
        run: terraform plan -destroy -input=false -out=tfplan

      # The demo escape hatch grants standing eligibility outside the access
      # package flow. It must never reach a real environment.
      - name: Verify no demo eligibility
        if: inputs.action != 'destroy'
        run: |
          if terraform show -json tfplan | grep -q 'demo_eligible_user_principal_names":\["'; then
            echo "::error::demo_eligible_user_principal_names is in use. That grants standing eligibility outside the access package flow and must not occur in CI."
            exit 1
          fi
          echo "OK — no demo eligibility in plan."

      - name: Plan summary
        run: |
          {
            echo "### Terraform ${{ inputs.action }} — plan"
            echo '```'
            terraform show -no-color tfplan | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        run: terraform apply -auto-approve -input=false tfplan

      - name: Output contract
        if: inputs.action == 'apply'
        run: |
          {
            echo "### Contract for the access-package repo"
            echo ""
            echo "Group names, keyed \`{scope}--{role}\`:"
            echo '```json'
            terraform output -json group_names
            echo '```'
            echo "Access type per group — set this on the resource role binding:"
            echo '```json'
            terraform output -json access_package_access_type
            echo '```'
            echo "Approver groups, keyed on scope (only scopes with a \`dual\` role):"
            echo '```json'
            terraform output -json approver_group_names
            echo '```'
            echo "System owners per scope — request-gate approvers:"
            echo '```json'
            terraform output -json systemeier_by_scope
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post-destroy notes
        if: inputs.action == 'destroy'
        run: |
          {
            echo "### Destroy complete — two things Terraform did not undo"
            echo ""
            echo "**R4** — \`azuread_directory_role\` does nothing on destroy, so any Entra"
            echo "directory roles activated by the \`entra_role\` mechanism remain activated"
            echo "in the tenant."
            echo ""
            echo "**R1** — PIM onboarding is irreversible, and deleted groups can linger in"
            echo "the PIM for Groups list for up to 24 hours. Re-applying with the same group"
            echo "names shortly after may hit friction."
          } >> "$GITHUB_STEP_SUMMARY"
